<html lang="ar" dir="ltr">
<head>

<style>
:root{
  --gold1:#f6e1a8; --gold2:#d9ae5f; --gold3:#a8762e; --blue:#4fb6ff; --night:#070a12;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--night)}
body{font-family:'Tajawal',sans-serif;color:#fff;direction:ltr}
#caps,#wm,.logo,.ftitle,.grid,.cta .headline,.cta .label,.addr,.foot{direction:rtl}
#grainbox{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#stage{position:absolute;inset:0;perspective:1600px;perspective-origin:50% 45%;overflow:hidden;background:var(--night)}
.shot{position:absolute;inset:0;transform-style:preserve-3d;backface-visibility:hidden;overflow:hidden;will-change:transform,opacity}
.fill{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
.kb{position:absolute;inset:-2px;transform-origin:50% 50%}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.gold-text{background:linear-gradient(180deg,#fff6d8 0%,#f3d58f 35%,#c8933f 70%,#f0cf86 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* 3D card */
.cardwrap{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.card{position:absolute;overflow:hidden;border-radius:30px;box-shadow:0 60px 120px rgba(0,0,0,.65),0 0 0 2px rgba(246,225,168,.35);
  -webkit-box-reflect:below 26px linear-gradient(transparent 62%,rgba(255,255,255,.22));background:#111}
.card img{position:absolute;height:100%;width:auto;top:0}
.sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 48%,rgba(255,255,255,.05) 55%,transparent 65%);mix-blend-mode:screen}

/* captions */
#scrim{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(to top,rgba(4,6,12,.92) 0%,rgba(4,6,12,.65) 40%,rgba(4,6,12,0) 100%);opacity:0}
#topscrim{position:absolute;left:0;right:0;top:0;height:360px;background:linear-gradient(to bottom,rgba(4,6,12,.7),rgba(4,6,12,0));opacity:0}
.cap{position:absolute;right:80px;left:80px;bottom:190px;text-align:right;opacity:0}
.cap .k{display:flex;align-items:center;gap:22px;font:700 38px 'Tajawal';color:var(--gold1);letter-spacing:1px}
.cap .k .ln{height:3px;width:120px;background:linear-gradient(to left,var(--gold2),rgba(217,174,95,0));transform-origin:right center}
.cap .k .num{font:600 34px 'El Messiri';color:var(--gold2)}
.cap .t{margin-top:18px;font:700 108px/1.25 'El Messiri';text-shadow:0 8px 40px rgba(0,0,0,.6)}
.cap .t .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 0 10px}
.cap .t .w span{display:inline-block}
.cap .s{margin-top:14px;font:500 44px 'Tajawal';color:rgba(255,255,255,.88)}

/* watermark */
#wm{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:18px;opacity:0}
#wm .name{font:700 64px 'Aref Ruqaa';line-height:1}
#wm .sub{font:500 26px 'Tajawal';color:rgba(255,255,255,.8);letter-spacing:2px}

/* overlays */
#leak{position:absolute;inset:-200px;opacity:0;mix-blend-mode:screen;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 30% 40%,rgba(255,190,110,.95),rgba(255,140,60,0) 70%),radial-gradient(ellipse 50% 50% at 75% 65%,rgba(255,235,190,.9),rgba(255,200,120,0) 70%)}
#flash{position:absolute;inset:0;background:#fff7e6;opacity:0;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#grain{position:absolute;left:0;top:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none}
#parts{position:absolute;inset:0;pointer-events:none}
.p{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff3cf 0%,rgba(246,215,140,.8) 35%,rgba(246,215,140,0) 70%)}

/* intro */
.logo{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.logo .row{display:flex;align-items:center;gap:38px;direction:rtl}
.logo .big{font:700 250px/1.1 'Aref Ruqaa';filter:drop-shadow(0 0 40px rgba(255,190,90,.45))}
.logo .tag{font:700 58px 'Tajawal';color:var(--blue);letter-spacing:4px;text-shadow:0 0 30px rgba(79,182,255,.7)}
.logo .pre{font:600 60px 'El Messiri';color:var(--gold1);letter-spacing:18px;margin-bottom:-10px}
.leaf path,.leaf line{fill:none;stroke:#7cc8ff;stroke-linecap:round;filter:drop-shadow(0 0 12px rgba(79,182,255,.9))}

/* features */
.ftitle{position:absolute;top:250px;left:70px;right:70px;text-align:center}
.ftitle .k{font:700 40px 'Tajawal';color:var(--gold1);letter-spacing:2px}
.ftitle .t{font:700 92px/1.3 'El Messiri';margin-top:10px}
.grid{position:absolute;top:620px;left:70px;right:70px;display:grid;grid-template-columns:1fr 1fr;gap:26px;perspective:1200px}
.chip{display:flex;align-items:center;gap:20px;height:146px;padding:0 28px;white-space:nowrap;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  border:2px solid rgba(246,225,168,.45);box-shadow:0 20px 50px rgba(0,0,0,.35);transform-origin:50% 0%}
.chip svg{width:72px;height:72px;flex:none}
.chip svg *{fill:none;stroke:var(--gold1);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.chip b{font:700 44px 'Tajawal'}

.chip.wide{grid-column:1 / -1;justify-content:center;border-width:3px;border-color:rgba(246,225,168,.8);background:linear-gradient(135deg,rgba(246,225,168,.25),rgba(168,118,46,.12))}
.chip.wide b{font-size:50px;color:var(--gold1)}
/* beds */
.beds .head{position:absolute;top:330px;left:70px;right:70px;text-align:center;direction:rtl}
.beds .head .k{font:700 42px 'Tajawal';color:var(--gold1);letter-spacing:2px}
.beds .head .t{font:700 150px/1.25 'El Messiri';margin-top:6px}
.beds .list{position:absolute;top:760px;left:80px;right:80px;display:flex;flex-direction:column;gap:46px;perspective:1300px;direction:rtl}
.bcard{display:flex;align-items:center;gap:40px;padding:44px 50px;border-radius:40px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
  border:2px solid rgba(246,225,168,.55);box-shadow:0 30px 70px rgba(0,0,0,.45);transform-origin:50% 0%}
.bcard .ic{flex:none;width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(246,225,168,.12);border:2px solid rgba(246,225,168,.5)}
.bcard svg{width:110px;height:110px}.bcard svg *{fill:none;stroke:var(--gold1);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bcard .n{font:700 62px 'El Messiri'}.bcard .d{font:500 42px 'Tajawal';color:rgba(255,255,255,.85);margin-top:6px}
.bcard .num{font:700 40px 'El Messiri';color:var(--gold2)}
/* notes */
.note{position:absolute;inset:0;direction:rtl;text-align:center}
.note .box{position:absolute;left:70px;right:70px;top:50%;transform:translateY(-50%)}
.note .ic{width:190px;height:190px;margin:0 auto 30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(10,14,26,.45);border:3px solid rgba(246,225,168,.7);box-shadow:0 0 60px rgba(246,215,140,.35)}
.note .ic svg{width:120px;height:120px}.note .ic svg *{fill:none;stroke:var(--gold1);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.note .k{font:700 44px 'Tajawal';color:var(--gold1);letter-spacing:2px}
.note .t{font:700 112px/1.3 'El Messiri';margin-top:14px;text-shadow:0 10px 50px rgba(0,0,0,.7)}
.note .t2{font:700 104px/1.3 'El Messiri'}
.note .s{font:500 46px/1.5 'Tajawal';margin-top:24px;color:rgba(255,255,255,.92);text-shadow:0 4px 20px rgba(0,0,0,.8)}
.note .rows{margin-top:56px;display:flex;flex-direction:column;gap:34px;perspective:1200px}
.note .row2{display:flex;align-items:center;gap:34px;padding:36px 44px;border-radius:36px;text-align:right;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:2px solid rgba(246,225,168,.55);box-shadow:0 26px 60px rgba(0,0,0,.4);transform-origin:50% 0}
.note .badge{flex:none;width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 64px 'El Messiri';color:#1a1408;background:linear-gradient(180deg,#fff1c4,#d9ae5f)}
.note .row2 .n{font:700 58px 'El Messiri'}.note .row2 .d{font:500 42px 'Tajawal';color:rgba(255,255,255,.88);margin-top:4px}
/* rain */
.rainfx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
/* cta */
.cta{position:absolute;inset:0}
.cta .logo{top:110px}
.cta .logo .big{font-size:190px}
.cta .logo .tag{font-size:46px}
.headline{position:absolute;top:520px;left:0;right:0;text-align:center;font:700 112px 'El Messiri'}
.label{position:absolute;top:700px;left:0;right:0;text-align:center;font:700 46px 'Tajawal';color:rgba(255,255,255,.9)}
.phones{position:absolute;top:790px;left:110px;right:110px;display:flex;flex-direction:column;gap:36px}
.phone{height:170px;border-radius:85px;display:flex;align-items:center;justify-content:center;gap:34px;direction:ltr;
  background:linear-gradient(135deg,rgba(246,225,168,.22),rgba(168,118,46,.12));border:3px solid rgba(246,225,168,.8);box-shadow:0 0 50px rgba(217,174,95,.25),inset 0 0 30px rgba(246,225,168,.12);overflow:hidden;position:relative}
.phone .num{font:800 92px 'Tajawal';letter-spacing:6px;color:#fff;padding-top:12px}
.phone svg{width:74px;height:74px}
.phone .shine{position:absolute;top:0;bottom:0;width:240px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);left:-300px}
.loc{position:absolute;top:1250px;left:70px;right:70px;display:flex;align-items:center;gap:44px;direction:rtl}
.qrbox{position:relative;flex:none;width:400px;padding:24px 24px 14px;border-radius:38px;background:#fff;border:5px solid var(--gold2);box-shadow:0 0 70px rgba(246,215,140,.45);text-align:center;overflow:hidden}
.qrbox img{width:342px;height:342px;display:block;margin:0 auto}
.qrbox .qc{font:800 36px 'Tajawal';color:#0e1220;margin-top:4px;direction:rtl}
.qrbox .scan{position:absolute;left:0;right:0;height:70px;background:linear-gradient(to bottom,rgba(217,174,95,0),rgba(217,174,95,.55),rgba(217,174,95,0));top:-80px}
.addr{flex:1;text-align:right}
.addr .a1{display:flex;justify-content:flex-start;align-items:center;gap:20px;font:700 50px 'Tajawal';color:var(--gold1)}
.addr .a3{font:500 34px/1.45 'Tajawal';margin-top:18px;color:rgba(246,225,168,.85)}
.addr .a2{font:500 44px/1.5 'Tajawal';margin-top:14px;color:#fff}
.foot{position:absolute;bottom:90px;left:0;right:0;text-align:center;font:500 32px 'Tajawal';color:rgba(255,255,255,.6);letter-spacing:3px}
</style>
</head>

// ---------- transitions ----------
function applyIn(s,p,st){ // st: style object accumulating
  const e=eio(p);
  switch(s.in){
    case 'fade': st.op*=e; st.tf+=` scale(${lerp(1.06,1,e)})`; break;
    case 'iris': st.clip=`circle(${lerp(0,75,eio(p))}% at 50% 48%)`; break;
    case 'flash': st.op*=clamp(p*1.6); break;
    case 'zoomthru': st.op*=clamp(p*1.4); st.tf+=` scale(${lerp(1.5,1,eo(p))})`; st.blur=lerp(14,0,eo(p)); break;
    case 'cube': st.tf+=` translateZ(-540px) rotateY(${lerp(-90,0,e)}deg) translateZ(540px)`; st.dim=Math.max(st.dim,(1-e)*.7); break;
    case 'slide3d': st.tf+=` translateX(${lerp(-1080,0,e)}px) rotateY(${lerp(-35,0,e)}deg)`; break;
  }
}
function applyOut(s,next,p,st){
  const e=eio(p);
  switch(next.in){
    case 'cube': st.tf+=` translateZ(-540px) rotateY(${lerp(0,90,e)}deg) translateZ(540px)`; st.dim=Math.max(st.dim,e*.7); break;
    case 'slide3d': st.tf+=` translateX(${lerp(0,500,e)}px) scale(${lerp(1,.8,e)}) rotateY(${lerp(0,25,e)}deg)`; st.dim=Math.max(st.dim,e*.6); break;
    case 'zoomthru': st.tf+=` scale(${lerp(1,1.9,ei(p))})`; st.blur=lerp(0,16,p); break;
    case 'fade': st.tf+=` scale(${lerp(1,1.04,e)})`; break;
    case 'iris': st.tf+=` scale(${lerp(1,.94,e)})`; st.dim=Math.max(st.dim,e*.5); break;
  }
}

function kbT(kb,u){
  const s=lerp(...(kb.s||[1,1]),u), x=lerp(...(kb.x||[0,0]),u), y=lerp(...(kb.y||[0,0]),u),
        rx=lerp(...(kb.rx||[0,0]),u), ry=lerp(...(kb.ry||[0,0]),u);
  return `translate(${x}%,${y}%) rotateX(${rx}deg) rotateY(${ry}deg) scale(${s})`;
}

    ph.style.transform=`perspective(900px) rotateX(${lerp(70,0,q)}deg) translateY(${lerp(60,0,q)}px)`;
    const cyc=((L-4.2-i*.4)%3.2+3.2)%3.2; ph.querySelector('.shine').style.left=`${lerp(-300,1100,clamp(cyc/1.1))}px`;
    const pulse=1+.015*Math.sin((L-4)*2.6+i); ph.style.transform+=` scale(${L>4.2?pulse:1})`;});
  const ad=el.querySelector('.addr'); const aq=eo(seg(L,4.3,5.2)); ad.style.opacity=aq; ad.style.transform=`translateY(${lerp(40,0,aq)}px)`;
  const qb=el.querySelector('.qrbox'); const qq=eo(seg(L,3.8,4.9)); qb.style.opacity=qq;
  qb.style.transform=`perspective(1000px) rotateY(${lerp(-100,0,qq)}deg) scale(${lerp(.7,1,qq)*(L>5?1+.02*Math.sin((L-5)*2.4):1)})`;
  const sc=((L-5)%2.4+2.4)%2.4; qb.querySelector('.scan').style.top=(L>5?lerp(-80,480,clamp(sc/1.4)):-80)+'px';
  el.querySelector('.foot').style.opacity=seg(L,4.6,5.4)*.9;
  el.querySelector('.dim').style.opacity=lerp(.2,.5,seg(L,0,2.5));
}

// ---------- captions ----------
function renderCap(c,t){
  const e=c.el; if(t<c.t0-0.01||t>c.t1+0.01){e.style.opacity=0;return 0}
  const L=t-c.t0, out=seg(t,c.t1-.5,c.t1);
  e.style.opacity=clamp(L/.35)*(1-out);
  e.style.transform=`translateY(${-30*eio(out)}px)`; e.style.filter=out>0?`blur(${out*8}px)`:'none';
  e.querySelector('.ln').style.transform=`scaleX(${eo(seg(L,0,.8))})`;
  e.querySelector('.kk').style.opacity=seg(L,.2,.7); e.querySelector('.num').style.opacity=seg(L,.1,.5);
  e.querySelectorAll('.t .w span').forEach((w,i)=>{const p=eo5(seg(L,.25+i*.1,.95+i*.1)); w.style.transform=`translateY(${lerp(110,0,p)}%)`;});
  const sp=eo(seg(L,.7,1.4)); const sEl=e.querySelector('.s'); sEl.style.opacity=sp; sEl.style.transform=`translateY(${lerp(24,0,sp)}px)`;
  return clamp(L/.6)*(1-out);
}

// ---------- main render ----------
window.renderAt=async function(t){
  const waits=[]; let flash=0, leak=0;
  SHOTS.forEach((s,i)=>{
    const next=SHOTS[i+1];
    const visible = t>=s.t0 && t<= (next? next.t0+(next.tin||0) : s.t1) ;
    if(!visible){s.el.style.display='none';return}
    s.el.style.display='block';
    const st={op:1,tf:'',dim:0,clip:'none',blur:0};
    if(s.in && t < s.t0+s.tin) applyIn(s,(t-s.t0)/s.tin,st);
    if(next && t>next.t0) applyOut(s,next,(t-next.t0)/next.tin,st);
    if(s.in==='flash'||s.in==='zoomthru'){const p=(t-s.t0)/s.tin; if(p>=0&&p<=1.3){flash=Math.max(flash,Math.sin(Math.PI*clamp(p/1.3))*(s.in==='flash'?.75:.5)); leak=Math.max(leak,Math.sin(Math.PI*clamp(p/1.3)))}}
    if(s.in==='cube'||s.in==='slide3d'){const p=(t-s.t0)/s.tin; if(p>=0&&p<=1) leak=Math.max(leak,.55*Math.sin(Math.PI*p))}
    s.el.style.opacity=st.op; s.el.style.transform=st.tf||'none'; s.el.style.clipPath=st.clip;
    s.el.style.filter=st.blur>0.05?`blur(${st.blur}px)`:'none';
    const dm=s.el.querySelector(':scope > .dim'); if(dm && s.type!=='features' && s.type!=='cta' && s.type!=='note') dm.style.opacity=st.dim;
    waits.push(renderShot(s,t));
  });
  // captions + scrim
  let capA=0; CAPS.forEach(c=>{capA=Math.max(capA,renderCap(c,t))});
  document.getElementById('scrim').style.opacity=Math.max(capA, seg(t,61.6,62.4)*(1-seg(t,67.6,68.4))*0);
  // watermark
  const wmA=seg(t,6.6,7.6)*(1-seg(t,77.3,78.1));
  document.getElementById('wm').style.opacity=wmA; document.getElementById('topscrim').style.opacity=wmA;
  // overlays
  document.getElementById('flash').style.opacity=flash;
  const lk=document.getElementById('leak'); lk.style.opacity=leak*.85;
  lk.style.transform=`translate(${Math.sin(t*.7)*120}px,${Math.cos(t*.5)*160}px) rotate(${t*8}deg)`;
  // particles: strong in intro/features/cta, light elsewhere
  const pA=Math.max(1-seg(t,5.6,6.6), seg(t,77.7,78.7)) *1 + .25;
  PARTS.forEach((q,i)=>{const y=((q.y - t*q.sp)%1920+1920)%1920, x=q.x+Math.sin(t*.8+q.ph)*q.dr;
    const tw=.5+.5*Math.sin(t*2.2+q.ph*3);
    q.e.style.transform=`translate(${x}px,${y}px)`; q.e.style.width=q.e.style.height=q.sz+'px';
    q.e.style.opacity=Math.min(1,pA)*tw*(i%3===0?1:.6);});
  // grain
  const f=Math.floor(t*FPS); const gr=rnd(f+11);
  g.style.transform=`translate(${-gr()*540}px,${-gr()*960}px)`;
  await Promise.all(waits);
  return true;
};
window.ready=(async()=>{await document.fonts.ready;
  const imgs=[...document.images].filter(i=>i.getAttribute('src'));await Promise.all(imgs.map(i=>i.decode().catch(()=>{})));
  await window.renderAt(0); return true})();
</script>
